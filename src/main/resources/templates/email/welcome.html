<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome Email</title>
</head>
<body style="margin:0; padding:0; width:100% !important; -webkit-text-size-adjust:none; background:#6a11cb; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white;">
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background:#6a11cb; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);">
    <tr>
      <td align="center" style="padding:40px 15px;">
        <!-- Container -->
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="background:transparent; text-align:left;">
          <tr>
            <td style="font-size:28px; font-weight:bold; margin-bottom:12px; padding-bottom:10px;" th:text="${fullName}">
              PRITAM DAS
            </td>
          </tr>
          <tr>
            <td style="font-size:14px; font-weight:600; background: rgba(255,255,255,0.2); padding:6px 14px; border-radius:20px; display:inline-block; margin-bottom:30px; letter-spacing:0.7px;">
              FREE TEMPLATES
            </td>
          </tr>
          <tr>
            <td style="font-size:20px; font-weight:bold; line-height:1.3; padding-bottom:15px;">
              Welcome<br />Email Template
            </td>
          </tr>
          <tr>
            <td style="font-size:16px; line-height:1.5; opacity:0.9; padding-bottom:30px;" th:text="${message}">
              Thanks for joining us! We are excited to have you on board. Get started by exploring our features and managing your profile.
            </td>
          </tr>
          <tr>
            <td align="left">
              <a href="#" th:href="${actionUrl}" style="background:#ffffff; color:#2575fc; font-weight:bold; padding:14px 32px; border-radius:25px; text-decoration:none; font-size:16px; letter-spacing:0.5px; display:inline-block;">
                Get Started
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding-top:40px; font-size:12px; opacity:0.7; text-align:center; color:white;">
              <p style="margin:0;">
                Follow us: 
                <a href="https://facebook.com/yourpage" style="color:white; text-decoration:underline; margin:0 6px;">Facebook</a> | 
                <a href="https://twitter.com/yourpage" style="color:white; text-decoration:underline; margin:0 6px;">Twitter</a> | 
                <a href="https://instagram.com/yourpage" style="color:white; text-decoration:underline; margin:0 6px;">Instagram</a>
              </p>
              <p style="margin:10px 0 0;">
                <a href="https://yourapp.com/unsubscribe" style="color:white; text-decoration:underline;">Unsubscribe</a>
              </p>
              <p style="margin:10px 0 0;">&copy; 2026 Your App Name. All rights reserved.</p>
            </td>
          </tr>
        </table>
        <!-- End container -->
      </td>
    </tr>
  </table>
</body>
</html>
