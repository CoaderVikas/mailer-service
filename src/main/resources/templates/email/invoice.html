<div style="max-width:600px; margin:auto; background:#fff; border-radius:8px; overflow:hidden;">
    <div style="text-align:center; padding:20px;">
        <img th:src="@{https://yourdomain.com/logo.png}" alt="Logo" width="150">
    </div>
    <div style="background:#FF9800; color:white; text-align:center; padding:15px; font-size:20px;">
        Your Invoice is Ready
    </div>
    <div style="padding:20px; color:#333;">
        <p>Hi <strong th:text="${name}">Customer</strong>,</p>
        <p>Thank you for your purchase! Your invoice <strong th:text="${invoiceNumber}">#12345</strong> is attached.</p>
        <p>Total: <strong th:text="${amount}">$0.00</strong></p>
        <a th:href="${invoiceUrl}" style="background:#FF9800; color:white; padding:12px 25px; text-decoration:none; border-radius:5px;">View Invoice</a>
    </div>
    <div style="padding:15px; font-size:12px; text-align:center; color:#777; background:#f1f1f1;">
        <p><a href="https://yourapp.com/unsubscribe" style="color:#999; text-decoration:underline;">Unsubscribe</a></p>
    </div>
</div>
